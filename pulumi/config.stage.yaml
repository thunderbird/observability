      #     assign_public_ip: yes
      #     availability_zone_rebalancing: ENABLED
      #     desired_count: 2
      #     ecr_resources:
      #       - 768512802988.dkr.ecr.eu-central-1.amazonaws.com/thunderbird/fluent-bit:*
      #     internal: yes