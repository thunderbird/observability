---

config:
  build_site24x7: False
  build_tbpulumi: True

resources:
  tb:secrets:PulumiSecretsManager:
    secrets:
      secret_names:
        - posthog_api_key

  tb:network:MultiCidrVpc:
    fluentbit:
      # This project has all of 10.200.0.0/16 assigned to it, but let's not soak all those up
      # This gets us 10.200.0.0 -> 10.200.3.255
      cidr_block: 10.200.0.0/22
      subnets:
        eu-central-1a:
          - 10.200.0.0/23  # 10.200.0.0 -> 10.200.1.255
        eu-central-1b:
          - 10.200.0.128/25  # 10.200.2.0 -> 10.200.3.255
      # Allow traffic out via an IGW so we can talk to Posthog and other services
      enable_internet_gateway: True
      egress_via_internet_gateway: True
      # Required for load balancing Fargate containers
      enable_dns_hostnames: True
      endpoint_interfaces:
        - logs
        - secretsmanager

  tb:fargate:AutoscalingFargateCluster:
    fluentbit:
      cluster: {}
      log_key: {}
      secrets: {}
      services:
        fluentbit: {}
      task_definitions:
        fluentbit:
          container_definitions:
            # ref: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-tasks-services.html#fargate-tasks-size
            - name: fluent-bit
              environment:
                - name: ENV
                  value: dev
                - name: FLUENTBIT_LOG_LEVEL
                  value: info
                - name: FLUENTBIT_VERSION
                  value: 4.2.2
              # secrets:
              #   - name: POSTHOG_API_KEY
              #     valueFrom: $arn_goes_here
              image: 768512802988.dkr.ecr.eu-central-1.amazonaws.com/thunderbird/fluent-bit:rjung
              logConfiguration:
                logDriver: awslogs
                options:
                  awslogs-group: observability-stage-loggroup-fluentbit
              portMappings:
                - containerPort: 1337
                  protocol: tcp
              restartPolicy:
                enabled: yes
                restartAttemptPeriod: 300
          cpu: 512
          family: fluentbit
          memory: 1024
          network_mode: awsvpc
          requires_compatibilities:
            - FARGATE




