[project]
name = "observability"
version = "0.0.1"
description = "Product observability resources"
requires-python = ">=3.13"
dynamic = ["dependencies"]

[project.urls]
repository = "https://github.com/thunderbird/observability.git"
issues = "https://github.com/thunderbird/observability/issues"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.optional-dependencies]
dev = [
    "pre-commit",
    "ruff",
]
