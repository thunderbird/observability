config:
  # These are all site24x7 provider variables
  site24x7:oauth2ClientId:
    secure: AAABANmLczqmOj6DykiwXCFIDvwMdkRaiotWweOjuLz9F6mVCBEjnF0uWiuWy3sdcLIjdttNd3OIA3VHxDHWc7EUcg==
  site24x7:oauth2ClientSecret:
    secure: AAABALKbdZHHs4Dh0ddSkFqjxzR+Ku4ZeOb8ZqcAWwZNHtfrVpik+EIHK6tJ2+xqkBONxCJSL8PXr+a9fi+LpDp47sH+21fx0No=
  site24x7:oauth2RefreshToken:
    secure: AAABAHHawF75rvpJMEakuJrdZ4Uosc4Px11TMfBPcV0lrxEoH+s2QLdy+ViMrs+Lgj3wHdQDv08eWgsYaNsZ2T8nNaiPC55KdopQ6pwHZccn95XNhtyEYG+t3CsLRsdhhW1IXjoS
  site24x7:dataCenter: US
  observability:location_profiles:
    global_spread:
      outer_regions_location_consent: true
      primary_location: "10"
      profile_name: Global Spread (P)
      restrict_alternate_location_polling: true
      secondary_locations:
        - "27"
        - "40"
        - "113"
        - "18"
        - "21"
        - "47"
  observability:monitor_groups:
    accounts:
      description: Monitors related to auth and identity
      display_name: TB Pro Accounts (P)
      user_groups:
        - tbpro-prod-oncall
    appointment:
      description: Monitors related to the Appointment app
      display_name: TB Pro Appointment (P)
      user_groups:
        - tbpro-prod-oncall
    send:
      description: Monitors related to the Send app
      display_name: TB Pro Send (P)
      user_groups:
        - tbpro-prod-oncall
    thundermail:
      description: Monitors related to mail, contacts, and calendaring
      display_name: TB Pro Thundermail (P)
      user_groups:
        - tbpro-prod-oncall
  observability:monitors:
    prod-accounts-backend-website:
      check_frequency: 5
      display_name: '[Prod] Accounts Backend (P)'
      http_method: G
      kind: website
      location_profile: global_spread
      matching_keyword_value: accounts
      monitor_groups:
        - accounts
      notification_profile: high-severity
      timeout: 5
      user_groups:
        - tbpro-prod-oncall
      website: https://accounts.tb.pro/health
    prod-accounts-frontend-website:
      check_frequency: 5
      display_name: '[Prod] Accounts Frontend (P)'
      follow_http_redirection: false
      http_method: G
      kind: website
      location_profile: global_spread
      monitor_groups:
        - accounts
      notification_profile: high-severity
      response_headers:
        location: /login/
      timeout: 5
      up_status_codes: "302"
      user_groups:
        - tbpro-prod-oncall
      website: https://accounts.tb.pro/
    prod-auth-website:
      check_frequency: 5
      display_name: '[Prod] Auth Frontend (P)'
      follow_http_redirection: false
      http_method: G
      kind: website
      location_profile: global_spread
      matching_keyword_value: If you are not automatically redirected to Thunderbird Accounts
      monitor_groups:
        - accounts
      notification_profile: high-severity
      timeout: 5
      up_status_codes: "200"
      user_groups:
        - tbpro-prod-oncall
      website: https://auth.tb.pro/
    prod-stalwart-imap:
      display_name: '[Prod] Stalwart IMAP (P)'
      host_name: mail.thundermail.com
      invert_port_check: false
      kind: port
      location_profile: global_spread
      monitor_groups:
        - thundermail
      notification_profile: high-severity
      port: 143
      timeout: 5
      use_ssl: false
      user_groups:
        - tbpro-prod-oncall
    stage-accounts-backend-website:
      check_frequency: 5
      display_name: '[Stage] Accounts Backend (P)'
      http_method: G
      kind: website
      location_profile: global_spread
      matching_keyword_value: accounts
      monitor_groups:
        - accounts
      notification_profile: low-severity
      timeout: 5
      user_groups:
        - tbpro-stage
      website: https://accounts-stage.tb.pro/health
    stage-accounts-frontend-website:
      check_frequency: 5
      display_name: '[Stage] Accounts Frontend (P)'
      follow_http_redirection: false
      http_method: G
      kind: website
      location_profile: global_spread
      monitor_groups:
        - accounts
      notification_profile: low-severity
      response_headers:
        location: /login/
      timeout: 5
      up_status_codes: "302"
      user_groups:
        - tbpro-stage
      website: https://accounts-stage.tb.pro/
    stage-auth-website:
      check_frequency: 5
      display_name: '[Stage] Auth Frontend (P)'
      follow_http_redirection: false
      http_method: G
      kind: website
      location_profile: global_spread
      matching_keyword_value: If you are not automatically redirected to Thunderbird Accounts
      monitor_groups:
        - accounts
      notification_profile: low-severity
      timeout: 5
      up_status_codes: "200"
      user_groups:
        - tbpro-stage
      website: https://auth-stage.tb.pro/
    stage-stalwart-imap:
      display_name: '[Stage] Stalwart IMAP (P)'
      host_name: mail.stage-thundermail.com
      invert_port_check: false
      kind: port
      location_profile: global_spread
      monitor_groups:
        - thundermail
      notification_profile: low-severity
      port: 143
      timeout: 5
      use_ssl: false
      user_groups:
        - tbpro-stage
  observability:notification_profiles:
    high-severity:
      alert_configurations:
        - notification_media:
            - "1"
            - "2"
            - "3"
            - "6"
          status: -1
      profile_name: High Severity (P)
      rca_needed: true
    low-severity:
      alert_configurations:
        - notification_media:
            - "1"
          status: -1
      profile_name: Low Severity (P)
      rca_needed: false
  observability:posthog_api_key:
    secure: AAABAOfbfrRy0AQBvl5C9MX9YUcawqnXNwKwgZ97k6NN1mjrBJoIlgpP1HXEoCb5Sa+jV9zj+jDr5MDEg4LI35R4+ZCJkQqE4uyCMm958A==
  observability:refresh_site24x7_location_data: "false"
  observability:user_groups:
    tbpro-prod-oncall:
      display_name: TB Pro Production On Call (P)
      users:
        - rjung
    tbpro-stage:
      display_name: TB Pro Stage Engineers (P)
      users:
        - rjung
  observability:users:
    rjung:
      display_name: Ryan Jung (P)
      email_address: rjung@thunderbird.net
      selection_type: all_monitors
      statusiq_role: super_admin
      user_role: super_admin

