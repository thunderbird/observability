---

service:
  flush: 1
  grace: 5
  daemon: no
  dns.mode: UDP
  hot_reload: on
  log_level: info
  storage.path: /fluent-bit/buffers
  storage.backlog.flush_on_shutdown: on
  storage.keep.rejected: on
  storage.rejected.path: /fluent-bit/dlq

pipeline:
  inputs:
    - name: http
      tag: untagged
      port: 1337
      threaded: true
    
    # Log shippers should override the tag with the name of the application
    - name: forward
      tag: cloudwatch.untagged
      port: 24224

  filters:
    # Run a Lua script that breaks all events in a single Stalwart telemetry payload into multiple
    # records. The tag "telemetry_stalwart" here is the result of POSTing to the http input at the
    # path `/telemetry/stalwart`.
    - name: lua
      match: telemetry_stalwart
      script: /etc/fluent-bit/lua/stalwart_telemetry_events.lua
      call: stalwart_telemetry_callback
    
  outputs:
    # Throw away health checks
    - name: null
      match: health_check

    # Log untagged records to stdout (since we don't have disk access on ECS) so we can respond to them
    - name: stdout
      match: untagged

    # Send Stalwart telemetry to Posthog
    - name: http
      match: telemetry_stalwart
      host: us.i.posthog.com
      port: 443
      tls: on
      uri: /batch
      format: json_lines

    # Send logs onward to CloudWatch. Log groups by the derived name must pre-exist, and this
    # service must have sufficient IAM permissions to create log streams and post events to them.
    - name: cloudwatch_logs
      match: cloudwatch.stalwart.mail
      log_group_name: /tb/${ENV}/stalwart
      log_stream_name: mail
      region: eu-central-1
      # log_key: systemd message field?

    - name: cloudwatch_logs
      match: cloudwatch.stalwart.api
      log_group_name: /tb/${ENV}/stalwart
      log_stream_name: api
      region: eu-central-1
      # log_key: systemd message field?
    
    - name: cloudwatch_logs
      match: cloudwatch.untagged
      log_group_name: /tb/${ENV}/observability
      log_stream_name: untagged
      region: eu-central-1
      # log_key: systemd message field?